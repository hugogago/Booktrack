services:
  db:
    image: mysql:8.0
    container_name: booktrack-mysql
    restart: always
    environment:
      MYSQL_DATABASE: booktrack
      MYSQL_USER: booktrack
      MYSQL_PASSWORD: booktrack
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Booktrack-main/booktrack
      dockerfile: dockerfile
    container_name: booktrack-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/booktrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: booktrack
      SPRING_DATASOURCE_PASSWORD: booktrack
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Booktrack-main/frontend
      dockerfile: Dockerfile
    container_name: booktrack-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
