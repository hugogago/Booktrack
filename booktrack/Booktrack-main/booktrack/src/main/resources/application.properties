
# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://db:3306/booktrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=booktrack
spring.datasource.password=booktrack
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT y otros ajustes existentes
app.jwtSecret=mySecretKeyForBooktrackApplicationPleaseChangeThisInProductionWithALongerKeyForSecurity
app.jwtExpirationMs=86400000
server.port=8081
server.servlet.context-path=/
